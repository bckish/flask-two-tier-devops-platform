# Disposable local Kind fixture only. Sample values are not production credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: flask-local
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: flask-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        imagePullPolicy: Never
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: local-root-only
        - name: MYSQL_DATABASE
          value: devops
        - name: MYSQL_USER
          value: devops
        - name: MYSQL_PASSWORD
          value: local-smoke-only
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 768Mi
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - 127.0.0.1
          periodSeconds: 5
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: flask-local
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: flask-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: bckish-local/flask:runtime
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: MYSQL_USER
          value: devops
        - name: MYSQL_PASSWORD
          value: local-smoke-only
        - name: MYSQL_DB
          value: devops
        - name: HOST
          value: 0.0.0.0
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: flask-local
spec:
  selector:
    app: flask
  ports:
  - port: 5000
    targetPort: 5000
