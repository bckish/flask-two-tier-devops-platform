services:
  mysql:
    container_name: mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "devops"
      MYSQL_USER: "devops"
      MYSQL_PASSWORD: "local-dev-password"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - two-tier-nt

    restart: always
    healthcheck:
      # The temporary initialization server accepts local socket connections
      # before the application database is ready. Probe the actual TCP path.
      test:
        - CMD-SHELL
        - mysql --protocol=TCP --host=127.0.0.1 --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --database="$$MYSQL_DATABASE" --execute="SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  flask-app:
    container_name: two-tier-app
    build:
      context: .

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=devops
      - MYSQL_PASSWORD=local-dev-password
      - MYSQL_DB=devops

    networks:
      - two-tier-nt

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:

networks:
  two-tier-nt:
